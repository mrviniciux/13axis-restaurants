name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, validate, and build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholder for Prisma validation/generation; no database service is used.
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
      # Non-secret placeholder so `next build` can prerender the authenticated
      # pages (generateStaticParams + auth()) up to the cookie read, which marks
      # them dynamic. Never used at runtime.
      AUTH_SECRET: 'ci-build-placeholder-not-used-at-runtime'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
